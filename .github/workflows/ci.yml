name: Test Timegrove

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feat/companion-v10-camera'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test

  e2e:
    # Playwright 1.56.1 supports this pinned image, not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Keep V10 actual WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-v10-webgl-evidence
          path: |
            test-results/**/v10-timer-reading.png
            test-results/**/v10-timer-tea.png
          if-no-files-found: warn
          retention-days: 14
